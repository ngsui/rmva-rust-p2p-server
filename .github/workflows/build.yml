# =============================================================================
# RMVA Rust P2P Server — CI 自动编译（Linux 服务器 + Windows DLL）
# -----------------------------------------------------------------------------
# 触发方式：
#   1. push 打 tag（v 开头，如 v0.1.0）→ 编译并发布到 GitHub Release
#   2. 手动触发（Actions 页面点 Run workflow）→ 仅编译，产物在 Actions 页下载
#
# 产物：
#   - p2p_server-linux-x86_64  （musl 静态链接，任何 x86_64 Linux 零依赖直跑）
#   - rgss3_rust_net_win32.zip （32 位 Windows DLL，放入游戏 System 目录）
#
# 服务器部署：
#   wget https://github.com/ngsui/rmva-rust-p2p-server/releases/download/v<版本>/p2p_server-linux-x86_64
#   chmod +x p2p_server-linux-x86_64 && ./p2p_server-linux-x86_64
# =============================================================================
name: Build Server and DLL

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write  # 发 Release 需要写权限

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Linux 服务器（musl 静态）
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链（含 musl 目标）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Rust 缓存（加速后续编译）
        uses: Swatinem/rust-cache@v2

      - name: 编译（musl 静态链接 release）
        run: cargo build --release --target x86_64-unknown-linux-musl -p server

      - name: 整理产物
        run: |
          cp target/x86_64-unknown-linux-musl/release/p2p_server p2p_server-linux-x86_64
          echo "版本: ${GITHUB_REF_NAME:-manual}"

      - name: 上传到 Actions 产物（手动触发时从这里下载）
        uses: actions/upload-artifact@v4
        with:
          name: p2p_server-linux-x86_64
          path: p2p_server-linux-x86_64

      - name: 发布到 GitHub Release（仅打 tag 时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: p2p_server-linux-x86_64
          generate_release_notes: true

  build-windows-server:
    name: Windows 服务器（x86_64）
    runs-on: windows-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存（加速后续编译）
        uses: Swatinem/rust-cache@v2

      - name: 编译（release）
        run: cargo build --release -p server

      - name: 整理产物
        shell: pwsh
        run: |
          Compress-Archive -Path target/release/p2p_server.exe `
            -DestinationPath p2p_server-win-x86_64.zip
          Write-Host "产物: p2p_server-win-x86_64.zip"

      - name: 上传到 Actions 产物（手动触发时从这里下载）
        uses: actions/upload-artifact@v4
        with:
          name: p2p_server-win-x86_64
          path: p2p_server-win-x86_64.zip

      - name: 发布到 GitHub Release（仅打 tag 时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: p2p_server-win-x86_64.zip
          generate_release_notes: true

  build-windows-dll:
    name: Windows DLL（32 位）
    runs-on: windows-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链（含 i686 目标）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc

      - name: Rust 缓存（加速后续编译）
        uses: Swatinem/rust-cache@v2

      - name: 编译（32 位 release，CRT 静态链接）
        run: cargo build --release --target i686-pc-windows-msvc -p net-win

      - name: 整理产物
        shell: pwsh
        run: |
          Compress-Archive -Path target/i686-pc-windows-msvc/release/rgss3_rust_net.dll `
            -DestinationPath rgss3_rust_net_win32.zip
          Write-Host "产物: rgss3_rust_net_win32.zip"

      - name: 上传到 Actions 产物（手动触发时从这里下载）
        uses: actions/upload-artifact@v4
        with:
          name: rgss3_rust_net_win32
          path: rgss3_rust_net_win32.zip

      - name: 发布到 GitHub Release（仅打 tag 时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: rgss3_rust_net_win32.zip
          generate_release_notes: true
