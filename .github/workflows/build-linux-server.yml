# =============================================================================
# Rust P2P 服务器 — Linux 自动编译
# -----------------------------------------------------------------------------
# 触发方式：
#   1. push 打 tag（v 开头，如 v1.0.0）→ 编译并发布到 GitHub Release
#   2. 手动触发（Actions 页面点 Run workflow）→ 仅编译，产物在 Actions 页下载
#
# 产物：p2p_server-linux-x86_64（musl 静态链接，任何 x86_64 Linux 零依赖直跑）
#
# 服务器部署：
#   wget https://github.com/ngsui/rmva-rust-p2p-server/releases/download/v<版本>/p2p_server-linux-x86_64
#   chmod +x p2p_server-linux-x86_64 && ./p2p_server-linux-x86_64
# =============================================================================
name: Build Linux Server

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write  # 发 Release 需要写权限

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rgss3_net

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链（含 musl 目标）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Rust 缓存（加速后续编译）
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rgss3_net

      - name: 编译（musl 静态链接 release）
        run: cargo build --release --target x86_64-unknown-linux-musl -p server

      - name: 重命名产物（带版本号）
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          cp target/x86_64-unknown-linux-musl/release/p2p_server \
             p2p_server-linux-x86_64
          echo "版本: ${VERSION:-manual}"

      - name: 上传到 Actions 产物（手动触发时从这里下载）
        uses: actions/upload-artifact@v4
        with:
          name: p2p_server-linux-x86_64
          path: rgss3_net/p2p_server-linux-x86_64

      - name: 发布到 GitHub Release（仅打 tag 时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: rgss3_net/p2p_server-linux-x86_64
          generate_release_notes: true
