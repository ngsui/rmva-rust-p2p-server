[package]
name = "server"
version = "0.1.0"
edition = "2021"

# Rust P2P 联机服务器 v1：tokio 异步，替代 p2p_server.py
# 兼容双协议：旧换行 JSON（Python 客户端）+ 新长度前缀帧（rgss3_rust_net.dll 客户端）
[[bin]]
name = "p2p_server"
path = "src/main.rs"

# 拍卖行端到端测试（需先启动 p2p_server + PostgreSQL）
[[bin]]
name = "test_e2e"
path = "src/test_e2e.rs"

[dependencies]
net-core = { path = "../net-core" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "time"] }
serde_json = "1"
# ===== PostgreSQL 存储层（玩家资产/拍卖行权威数据）=====
tokio-postgres = "0.7"      # 异步 PostgreSQL 驱动（与 tokio 无缝配合）
deadpool-postgres = "0.14"  # 连接池（自动回收泄漏连接，防止压垮数据库）
# ===== 密码哈希（argon2，现代抗 GPU 撞库标准）=====
argon2 = { version = "0.5", features = ["std"] }
rand_core = { version = "0.6", features = ["std"] } # 盐值随机源
